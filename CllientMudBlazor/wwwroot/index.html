<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Tool 2.0</title>
    <base href="/" />
    <!--<link rel="preload" id="webassembly" />-->

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
    <link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />

   

    <!--<script type="importmap"></script>-->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Usar (window as any) o simplemente declararlo como variable global
        window["scrollToElement"] = (elementId) => {
            const element = document.getElementById(elementId);
            if (element) {
                element.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center',
                    inline: 'nearest'
                });

                element.classList.add('highlight-new-task');

                setTimeout(() => {
                    element.classList.remove('highlight-new-task');
                }, 2000);
            } else {
                console.warn("Scroll failed: Element with id " + elementId + " not found.");
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
  
    <script src="_content/MudBlazor/MudBlazor.min.js?v=1"></script>
    <!--<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js?v=1"></script>-->
</body>

</html>
